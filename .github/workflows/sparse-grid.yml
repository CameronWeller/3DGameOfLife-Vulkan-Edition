name: Sparse Grid Tests

on:
  push:
  pull_request:

jobs:
  cpu-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S tests/standalone -B build-sparse -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-sparse --parallel
      - name: Test
        run: ctest --test-dir build-sparse --output-on-failure
