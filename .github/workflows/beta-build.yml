name: Beta Build and Test

on:
  push:
    branches: [ main, beta ]
  pull_request:
    branches: [ main, beta ]

jobs:
  build-and-test:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    # GitHub's Windows runners ship vcpkg at $env:VCPKG_INSTALLATION_ROOT.
    - name: Install dependencies
      run: |
        & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install --triplet x64-windows
    
    - name: Configure CMake
      run: |
        cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DBUILD_TESTING=ON
    
    - name: Build
      run: |
        cmake --build build --config Release --target 3DGameOfLife-Vulkan-Edition_beta
    
    - name: Compile Shaders
      run: |
        cmake --build build --config Release --target compile_shaders
    
    - name: Build Tests
      run: |
        cmake --build build --config Release --target smoke_test_beta playtest_beta
    
    - name: Run Smoke Test
      run: |
        cd build
        ctest --test-dir . -L smoke --output-on-failure

